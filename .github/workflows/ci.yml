name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      test-postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: gh_test
          POSTGRES_PASSWORD: gh_test_ci_only
          POSTGRES_DB: green_hubs_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gh_test -d green_hubs_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      GH_INTEGRATION_TEST_MODE: "true"
      GH_TEST_DATABASE_URL: postgresql+asyncpg://gh_test:gh_test_ci_only@127.0.0.1:55432/green_hubs_test
      ENVIRONMENT: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create and verify disposable test marker
        run: python scripts/test_db.py bootstrap-marker
      - name: Apply all Alembic migrations
        run: python scripts/test_db.py migrate
      - name: Verify marker, Alembic head, and pgvector
        run: python scripts/test_db.py verify
      - name: Collect guarded integration tests
        run: python scripts/run_integration_tests.py collect
      - name: Run guarded integration tests
        run: python scripts/run_integration_tests.py run

  # The AIOS signing protocol must produce byte-identical signatures in
  # Python and JavaScript. Both halves read ONE fixture
  # (backend/tests/fixtures/aios_signature_vectors.json) -- two
  # independently maintained copies of an expected signature would drift,
  # and each suite would then agree with itself while the two languages
  # disagreed on the wire.
  #
  # The NORA Health Check webhook must not be activated until this job
  # passes.
  aios-signature-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Python half of the parity gate
        working-directory: backend
        run: pytest tests/infrastructure/aios/test_internal_signature.py -q
      - name: JavaScript half of the parity gate
        run: node --test project-governance/07-aios/n8n-workflow-exports/nora-health-check/aios-signature.test.mjs
      - name: Workflow export secret and drift scan
        working-directory: backend
        run: pytest tests/api/test_aios_workflow_export.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
